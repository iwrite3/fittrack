# Run from this folder on the server:  docker compose up -d --build
x-java-service: &java-service
  restart: unless-stopped
  depends_on:
    configserver: { condition: service_healthy }
    eureka: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db

  rabbitmq:
    image: rabbitmq:3
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.0}
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx700m"
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }

  eureka:
    build: { context: ../eureka, dockerfile: ../deploy/Dockerfile.service }
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8761'"]
      interval: 10s
      retries: 20
      start_period: 40s

  configserver:
    build: { context: ../configserver, dockerfile: ../deploy/Dockerfile.service }
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888'"]
      interval: 10s
      retries: 20
      start_period: 40s

  user-service:
    <<: *java-service
    build: { context: ../userservice, dockerfile: ../deploy/Dockerfile.service }
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx300m"
      CONFIG_SERVER_URL: http://configserver:8888
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
      POSTGRES_URL: jdbc:postgresql://postgres:5432/fitness_user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DDL_AUTO: update
    depends_on:
      configserver: { condition: service_healthy }
      eureka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  activity-service:
    <<: *java-service
    build: { context: ../activityservice, dockerfile: ../deploy/Dockerfile.service }
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx300m"
      CONFIG_SERVER_URL: http://configserver:8888
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: activity-service
      MONGODB_URI: mongodb://mongo:27017/fitnessactivity
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

  ai-service:
    <<: *java-service
    build: { context: ../aiservice, dockerfile: ../deploy/Dockerfile.service }
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx300m"
      CONFIG_SERVER_URL: http://configserver:8888
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ai-service
      MONGODB_URI: mongodb://mongo:27017/fitnessrecommendation
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}

  gateway:
    <<: *java-service
    build: { context: ../gateway, dockerfile: ../deploy/Dockerfile.service }
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx300m"
      CONFIG_SERVER_URL: http://configserver:8888
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: gateway
      KEYCLOAK_URL: https://${DOMAIN}/auth
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
      args:
        VITE_API_URL: https://${DOMAIN}/api
        VITE_KEYCLOAK_URL: https://${DOMAIN}/auth
        VITE_REDIRECT_URI: https://${DOMAIN}/
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
    networks:
      default:
        # lets the gateway reach Keycloak through the public address from inside Docker
        aliases:
          - ${DOMAIN}
    depends_on:
      - keycloak
      - gateway

volumes:
  pgdata:
  mongodata:
  rabbitdata:
  caddy_data:
