server:
  port: 8080

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwt-set-uri: ${KEYCLOAK_URL:http://localhost:8181}/realms/fitness-oauth2/protocol/openid-connect/certs
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service    # Changed from lb:// to direct HTTP IP
          predicates:
            - Path=/api/users/**

        - id: activity-service
          uri: lb://activity-service         # Assuming you still want Eureka for these
          predicates:
            - Path=/api/activities,/api/activities/**

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/recommendations/**