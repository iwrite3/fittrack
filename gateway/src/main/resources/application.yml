server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8181}/realms/fitness-oauth2
  cloud:
    gateway:
      routes:
        - id: activity-service
          uri: ${ACTIVITY_SERVICE_URL:lb://activity-service}
          predicates:
            - Path=/api/activities,/api/activities/**
        - id: user-service
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/api/users/**
        - id: ai-service
          uri: ${AI_SERVICE_URL:lb://ai-service}
          predicates:
            - Path=/api/recommendations/**

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.cloud.gateway: INFO